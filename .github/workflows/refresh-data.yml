name: Refresh data snapshots

# Bakes fresh JSON snapshots from the TimescaleDB stats backend into
# docs/data/snapshots/ (served as-is by GitHub Pages — no site rebuild
# needed, the SPA fetches these files at view time). The scraper upstream
# samples hourly, so an hourly cron matches the source cadence.

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with deploy.yml: both commit-back to main.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-v2/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web-v2
        run: pnpm install --frozen-lockfile

      - name: Fetch snapshots
        working-directory: web-v2
        env:
          # Read-only, intentionally public credentials; override via repo
          # Settings → Variables → Actions if the backend moves.
          STATS_DB_URL: ${{ vars.STATS_DB_URL || 'postgresql://readonly:owstats-readonly@owstats.jhiggins.tech:5432/ow_stats?sslmode=require' }}
          STATS_GAMEMODE: ${{ vars.STATS_GAMEMODE || 'competitive' }}
        run: node scripts/fetch-snapshots.mjs --out ../docs/data/snapshots

      - name: Commit refreshed snapshots back to main
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/snapshots
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi
          git commit -m 'ci: refresh data snapshots [skip ci]'

          # Retry push to ride out any concurrent push to main.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt). Fetching + rebasing."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Push failed after 5 attempts.'
          exit 1
